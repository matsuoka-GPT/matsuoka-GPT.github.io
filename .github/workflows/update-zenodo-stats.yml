name: Update Zenodo statistics

on:
  schedule:
    # Three off-peak attempts in JST. Later attempts skip when today's data exists.
    - cron: "17 15 * * *"
    - cron: "37 16 * * *"
    - cron: "53 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-zenodo-statistics
  cancel-in-progress: false

jobs:
  update-zenodo-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check whether today's scheduled update is due
        id: freshness
        run: python scripts/check_zenodo_update_due.py >> "$GITHUB_OUTPUT"

      - name: Collect Zenodo statistics
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.should_run == 'true'
        run: python scripts/collect_zenodo_stats.py

      - name: Commit updated Zenodo statistics
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.should_run == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Zenodo statistics"
          file_pattern: data/zenodo/zenodo_records.csv data/zenodo/zenodo_records.json data/zenodo/zenodo_records.md data/zenodo/history.csv data/zenodo/categories.json zenodo-stats.html
